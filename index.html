
<!DOCTYPE html>
<html lang="ky">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ELNURA SHOWROOM</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#090909;color:white;font-family:Arial}
header{padding:18px 5%;background:#111;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #c6a34d;position:sticky;top:0;z-index:5}
.logo{font-size:22px;font-weight:bold;color:#d5b15c;letter-spacing:2px}
button{cursor:pointer}
header button,.gold{background:#c6a34d;color:#111;border:0;padding:11px 16px;border-radius:4px;font-weight:bold}
.hero{text-align:center;padding:75px 15px;background:radial-gradient(#493719,#090909 70%)}
.hero h1{font-size:clamp(30px,6vw,55px);color:#e1c477;letter-spacing:4px}
.hero p{color:#ddd;margin:15px}
h2{text-align:center;color:#d5b15c;padding:30px 10px}
.controls{display:flex;gap:10px;padding:15px 5%;flex-wrap:wrap}
input,select{padding:13px;background:#181818;color:white;border:1px solid #8c7139;border-radius:4px;flex:1;min-width:140px}
.categories{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;padding:15px}
.categories button{padding:10px 15px;background:#171717;border:1px solid #9b7a3b;color:#d5b15c;border-radius:25px}
.categories button.active{background:#c6a34d;color:#111}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;padding:15px 5% 50px}
.card{background:#171717;border:1px solid #333;border-radius:6px;overflow:hidden}
.card img{width:100%;height:260px;object-fit:cover;display:block;background:#252525}
.info{padding:13px}
.info small{color:#d5b15c}
.info h3{font-size:15px;margin:8px 0}
.price{color:#e1c477;font-weight:bold}
.actions{display:flex;gap:6px;margin-top:12px}
.actions button{flex:1;padding:10px;background:#c6a34d;border:0;border-radius:4px}
.actions .heart{background:#292929;color:white}
.overlay{display:none;position:fixed;inset:0;background:#000c;z-index:10;align-items:center;justify-content:center;padding:15px}
.panel{background:#171717;border:1px solid #c6a34d;border-radius:8px;padding:22px;width:100%;max-width:480px;max-height:85vh;overflow:auto}
.panel h2{padding:10px}
.line{padding:12px 0;border-bottom:1px solid #444;display:flex;justify-content:space-between;gap:8px}
.line button{padding:5px}
footer{text-align:center;padding:30px;border-top:1px solid #9b7a3b;color:#aaa}
@media(max-width:850px){.grid{grid-template-columns:repeat(3,1fr)}}
@media(max-width:600px){.grid{grid-template-columns:repeat(2,1fr);gap:9px;padding:10px}.card img{height:190px}.logo{font-size:16px}.controls{padding:10px}}
</style>
</head>
<body>
<header>
<div class="logo">ELNURA SHOWROOM</div>
<div>
<button onclick="favoritesOnly()">♡ <span id="fc">0</span></button>
<button onclick="openCart()">🛍️ <span id="cc">0</span></button>
</div>
</header>

<section class="hero">
<p>THE ART OF ELEGANCE</p>
<h1>ELNURA SHOWROOM</h1>
<p>YOUR STYLE • YOUR BEAUTY • YOUR LUXURY</p>
<button class="gold" onclick="document.getElementById('catalog').scrollIntoView({behavior:'smooth'})">SHOP NOW</button>
</section>

<h2 id="catalog">OUR COLLECTION</h2>
<div class="controls">
<input id="search" placeholder="🔍 Товар издөө..." oninput="render()">
<select id="sort" onchange="render()">
<option value="default">Сорттоо</option>
<option value="low">Арзанынан</option>
<option value="high">Кымбатынан</option>
</select>
<select id="limit" onchange="render()">
<option value="all">Бардык баалар</option>
<option value="2000">2000 сомго чейин</option>
<option value="3000">3000 сомго чейин</option>
<option value="5000">5000 сомго чейин</option>
</select>
</div>
<div class="categories" id="categories"></div>
<p id="count" style="text-align:center;color:#aaa;padding:10px"></p>
<div class="grid" id="products"></div>

<footer>
<h3 style="color:#d5b15c">ELNURA SHOWROOM</h3>
<p>Elegance is a choice.</p>
<p>© 2026 ELNURA SHOWROOM</p>
</footer>

<div class="overlay" id="overlay" onclick="if(event.target===this)closeCart()">
<div class="panel">
<h2>🛍️ СЕБЕТ</h2>
<div id="items"></div>
<h3 id="total" style="color:#d5b15c;padding:15px"></h3>
<button class="gold" onclick="checkout()">WHATSAPP ЗАКАЗ</button>
<button onclick="closeCart()" style="padding:11px;background:#333;color:white;border:0">Жабуу</button>
</div>
</div>

<script>
const WA="996XXXXXXXXX";
const categories=[
{name:"Көйнөк",folder:"dresses",price:2500,photo:"photo-1539008835657-9e8e9680c956"},
{name:"Шым",folder:"pants",price:1800,photo:"photo-1594633312681-425c7b97ccd1"},
{name:"Блузка",folder:"blouses",price:1500,photo:"photo-1564257577-5c6d5e9f8c5d"},
{name:"Юбка",folder:"skirts",price:1900,photo:"photo-1583496661160-fb5886a0aaaa"},
{name:"Куртка",folder:"jackets",price:3500,photo:"photo-1548126032-079a0fb0099d"}
];
const products=[];
categories.forEach((c,k)=>{
 for(let i=1;i<=50;i++){
 products.push({id:k*50+i,name:c.name+" №"+i,cat:c.name,price:c.price+(i-1)*50,
 img:`https://images.unsplash.com/${c.photo}?auto=format&fit=crop&w=500&q=80`});
 }
});
let cart=JSON.parse(localStorage.getItem("elnuraCart")||"[]");
let fav=JSON.parse(localStorage.getItem("elnuraFav")||"[]");
let category="Баары",onlyFav=false;

function save(){
 localStorage.setItem("elnuraCart",JSON.stringify(cart));
 localStorage.setItem("elnuraFav",JSON.stringify(fav));
 document.getElementById("cc").textContent=cart.reduce((s,x)=>s+x.qty,0);
 document.getElementById("fc").textContent=fav.length;
}
function makeCategories(){
 document.getElementById("categories").innerHTML=["Баары",...categories.map(x=>x.name)].map(x=>
 `<button class="${category===x?'active':''}" onclick="choose('${x}')">${x}</button>`).join("");
}
function choose(x){category=x;onlyFav=false;makeCategories();render()}
function favoritesOnly(){onlyFav=!onlyFav;category="Баары";makeCategories();render()}
function render(){
 let q=document.getElementById("search").value.toLowerCase();
 let limit=document.getElementById("limit").value;
 let sort=document.getElementById("sort").value;
 let list=products.filter(p=>(category==="Баары"||p.cat===category)&&(!onlyFav||fav.includes(p.id))&&p.name.toLowerCase().includes(q)&&(limit==="all"||p.price<=+limit));
 if(sort==="low")list.sort((a,b)=>a.price-b.price);
 if(sort==="high")list.sort((a,b)=>b.price-a.price);
 document.getElementById("count").textContent="Товарлар: "+list.length;
 document.getElementById("products").innerHTML=list.length?list.map(p=>`
 <article class="card">
 <img src="${p.img}" alt="${p.name}" loading="lazy">
 <div class="info"><small>${p.cat}</small><h3>${p.name}</h3>
 <p class="price">${p.price.toLocaleString()} сом</p>
 <div class="actions">
 <button onclick="add(${p.id})">Себетке</button>
 <button class="heart" onclick="toggleFav(${p.id})">${fav.includes(p.id)?"❤️":"♡"}</button>
 </div></div></article>`).join(""):"<p>Товар табылган жок</p>";
}
function toggleFav(id){fav=fav.includes(id)?fav.filter(x=>x!==id):[...fav,id];save();render()}
function add(id){let x=cart.find(a=>a.id===id);if(x)x.qty++;else cart.push({id,qty:1});save();alert("Себетке кошулду")}
function openCart(){document.getElementById("overlay").style.display="flex";updateCart()}
function closeCart(){document.getElementById("overlay").style.display="none"}
function updateCart(){
 document.getElementById("items").innerHTML=cart.length?cart.map(x=>{
 let p=products.find(a=>a.id===x.id);
 return `<div class="line"><span>${p.name} × ${x.qty}</span><span>${p.price*x.qty} сом <button onclick="qty(${p.id},-1)">−</button><button onclick="qty(${p.id},1)">+</button><button onclick="removeItem(${p.id})">×</button></span></div>`;
 }).join(""):"Себет бош";
 document.getElementById("total").textContent="Жалпы: "+cart.reduce((s,x)=>s+products.find(p=>p.id===x.id).price*x.qty,0).toLocaleString()+" сом";
}
function qty(id,n){let x=cart.find(a=>a.id===id);x.qty+=n;if(x.qty<=0)removeItem(id);else{save();updateCart()}}
function removeItem(id){cart=cart.filter(x=>x.id!==id);save();updateCart()}
function checkout(){
 if(!cart.length)return alert("Себет бош");
 if(!/^996\d{9}$/.test(WA))return alert("WhatsApp номерин кодго жаз");
 let lines=["Саламатсызбы! Заказ:"];
 cart.forEach(x=>{let p=products.find(a=>a.id===x.id);lines.push(p.name+" × "+x.qty+" = "+p.price*x.qty+" сом")});
 lines.push("Жалпы: "+cart.reduce((s,x)=>s+products.find(p=>p.id===x.id).price*x.qty,0)+" сом");
 window.open("https://wa.me/"+WA+"?text="+encodeURIComponent(lines.join("\n")),"_blank");
}
makeCategories();save();render();
</script>
</body>
</html>
