<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;color:#393039;background:#fff}
header{padding:20px 5%;display:flex;align-items:center;justify-content:space-between;gap:15px;flex-wrap:wrap}
.logo{font-family:Georgia,serif;font-size:32px;color:#9e6480}
.search{padding:12px;border:1px solid #eadde5;border-radius:25px;width:260px}
button{cursor:pointer}
nav{background:#a87591;padding:15px;text-align:center}
nav a{color:white;text-decoration:none;margin:0 15px;font-size:14px}
.banner{background:#f5eaf0;padding:35px 6%;display:flex;justify-content:space-between;align-items:center}
.banner h1{font-family:Georgia,serif;font-size:32px;font-weight:normal}
main{display:grid;grid-template-columns:210px 1fr;gap:25px;padding:35px 5%}
.sidebar h3{font-family:Georgia,serif;border-bottom:1px solid #eadde5;padding-bottom:10px}
.sidebar button{display:block;background:none;border:0;padding:9px 0;color:#665b64;text-align:left}
.sidebar button:hover{color:#a75d83}
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:25px;flex-wrap:wrap}
select{padding:10px;border:1px solid #eadde5;background:white}
.products{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:22px 15px}
.product{text-align:center;position:relative;border:1px solid #f2eaf0;padding-bottom:15px}
.product img{width:100%;height:190px;object-fit:cover;background:#f8f2f5}
.product h4{font-size:13px;font-weight:normal;min-height:32px;padding:0 7px}
.price{color:#a45d82;font-weight:bold}
.old{color:#aaa;text-decoration:line-through;font-size:12px}
.add{background:#a87591;color:white;border:0;padding:10px 15px;margin-top:8px}
.add:hover{background:#80506c}
.like{position:absolute;right:9px;top:9px;border:0;background:white;border-radius:50%;font-size:20px;color:#a87591;width:32px;height:32px}
.like.active{color:#e33}
.label{position:absolute;left:8px;top:8px;background:#a87591;color:white;padding:5px 8px;font-size:10px}
footer{background:#f5eaf0;text-align:center;padding:25px;color:#80506c}
@media(max-width:850px){
main{grid-template-columns:1fr}
.sidebar{display:flex;gap:15px;flex-wrap:wrap}
.products{grid-template-columns:repeat(3,minmax(0,1fr))}
}
@media(max-width:550px){
.products{grid-template-columns:repeat(2,minmax(0,1fr))}
.product img{height:160px}
.banner h1{font-size:24px}
}
</style>
</head>

let cart=[];
let favorites=[];
let currentCategory="Все";
let mode="all";

const list=document.getElementById("products");

function imageURL(photo){
 return "https://images.unsplash.com/"+photo+"?auto=format&fit=crop&w=500&q=80";
}

function draw(){
 let data=productsData.map((p,i)=>({...p,id:i}));
 if(currentCategory!=="Все")data=data.filter(p=>p[1]===currentCategory);
 if(mode==="favorites")data=data.filter(p=>favorites.includes(p.id));
 if(mode==="cart")data=data.filter(p=>cart.includes(p.id));

 const query=document.getElementById("search").value.toLowerCase();
 data=data.filter(p=>p[0].toLowerCase().includes(query));

 const sort=document.getElementById("sort").value;
 if(sort==="low")data.sort((a,b)=>a[2]-b[2]);
 if(sort==="high")data.sort((a,b)=>b[2]-a[2]);

 document.getElementById("count").textContent="Найдено товаров: "+data.length;

 list.innerHTML=data.map(p=>`
 <article class="product">
 <span class="label">${p[1]}</span>
 <button class="like ${favorites.includes(p.id)?"active":""}" onclick="toggleLike(${p.id})">♥</button>
 <img src="${imageURL(p[3])}" alt="${p[0]}" loading="lazy">
 <h4>${p[0]}</h4>
 <div class="price">${p[2]} $</div>
 <button class="add" onclick="addCart(${p.id})">В КОРЗИНУ</button>
 </article>
 `).join("");
 document.getElementById("cartCount").textContent=cart.length;
}

function filterCategory(category){
 currentCategory=category;
 mode="all";
 draw();
}

function toggleLike(id){
 if(favorites.includes(id)){
  favorites=favorites.filter(x=>x!==id);
 }else{
  favorites.push(id);
 }
 draw();
}

function addCart(id){
 cart.push(id);
 draw();
 alert("Товар добавлен в корзину!");
}
