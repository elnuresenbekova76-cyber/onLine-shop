
<!DOCTYPE html>
<html lang="ky">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ELNURA SHOWROOM</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
 background:#090909;
 color:#fff;
 font-family:Arial,sans-serif;
}
header{
 background:#111;
 padding:22px 5%;
 display:flex;
 justify-content:space-between;
 align-items:center;
 border-bottom:1px solid #b89545;
 position:sticky;top:0;z-index:10;
}
.logo{
 color:#d6b45b;
 font-size:25px;
 font-weight:bold;
 letter-spacing:3px;
}
header button,.gold{
 background:#c6a34d;
 color:#080808;
 border:0;padding:10px 15px;
 border-radius:5px;
 cursor:pointer;font-weight:bold;
}
.hero{
 text-align:center;
 padding:65px 15px;
 background:linear-gradient(135deg,#161616,#080808);
}
.hero h1{
 color:#d6b45b;
 font-size:38px;
 letter-spacing:4px;
}
.hero p{color:#aaa;margin:15px}
.controls{
 padding:20px 5%;
 display:flex;gap:10px;flex-wrap:wrap;
}
input,select{
 padding:13px;background:#191919;
 color:white;border:1px solid #9c7b36;
 border-radius:5px;flex:1;min-width:150px;
}
.grid{
 padding:10px 5% 40px;
 display:grid;
 grid-template-columns:repeat(4,1fr);
 gap:20px;
}
.card{
 background:#151515;
 border:1px solid #292929;
 border-radius:8px;overflow:hidden;
}
.card img{
 width:100%;height:260px;
 object-fit:cover;display:block;
}
.info{padding:14px}
.info h3{font-size:16px;margin-bottom:10px}
.price{color:#d6b45b;font-weight:bold}
.actions{
 display:flex;gap:7px;margin-top:12px;
}
.actions button{
 flex:1;padding:10px 5px;
 border:0;border-radius:4px;
 cursor:pointer;background:#c6a34d;
 font-weight:bold;
}
.actions .heart{background:#292929;color:#fff}
.section-title{
 text-align:center;color:#d6b45b;
 padding:20px;font-size:25px;
}
footer{
 text-align:center;padding:30px;
 border-top:1px solid #b89545;color:#aaa;
}
#cartPanel{
 display:none;position:fixed;inset:0;
 background:#000c;z-index:20;
 justify-content:center;align-items:center;
 padding:15px;
}
.cart{
 background:#171717;padding:25px;
 border:1px solid #c6a34d;
 width:100%;max-width:450px;
 max-height:85vh;overflow:auto;
 border-radius:10px;
}
.cart button{padding:10px;margin:5px;cursor:pointer}
.cart-row{
 padding:12px 0;border-bottom:1px solid #444;
 display:flex;justify-content:space-between;gap:10px;
}
@media(max-width:850px){
 .grid{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:480px){
 .grid{gap:10px;padding:10px}
 .card img{height:190px}
 .hero h1{font-size:27px}
 header{padding:15px}
 .logo{font-size:18px}
}
</style>
</head>
<body>

<header>
 <div class="logo">ELNURA SHOWROOM</div>
 <button onclick="openCart()">🛍️ Себет <span id="count">0</span></button>
</header>

<section class="hero">
 <h1>ELNURA SHOWROOM</h1>
 <p>YOUR STYLE • YOUR BEAUTY • YOUR LUXURY</p>
 <button class="gold" onclick="document.getElementById('products').scrollIntoView()">Сатып алуу</button>
</section>

<h2 class="section-title">OUR COLLECTION</h2>

<div class="controls">
 <input id="search" placeholder="🔍 Товар издөө..." oninput="render()">
 <select id="category" onchange="render()">
  <option value="all">Бардык товарлар</option>
  <option value="Көйнөк">Көйнөк</option>
  <option value="Шым">Шым</option>
  <option value="Блузка">Блузка</option>
  <option value="Юбка">Юбка</option>
  <option value="Куртка">Куртка</option>
 </select>
 <button class="gold" onclick="showFavorites()">❤️ Избранное</button>
</div>

<div class="grid" id="products"></div>

<div id="cartPanel">
 <div class="cart">
  <h2 style="color:#d6b45b">🛍️ Сиздин себетиңиз</h2>
  <div id="cartItems"></div>
  <h3 id="total" style="margin:15px 0;color:#d6b45b"></h3>
  <button class="gold" onclick="checkout()">WhatsApp заказ</button>
  <button onclick="closeCart()" style="background:#333;color:white">Жабуу</button>
 </div>
</div>

<footer>
 <h3 style="color:#d6b45b">ELNURA SHOWROOM</h3>
 <p>Сиздин сулуулугуңуз — биздин сыймыгыбыз.</p>
</footer>

<script>
// WhatsApp номериңди ушул жерге жаз.
const WHATSAPP = "996XXXXXXXXX";

// Ар бир товарга өзүнчө сүрөт URL коюлат.
// Азырынча демо сүрөттөр.
const products = [
 {id:1,name:"Классикалык көйнөк",cat:"Көйнөк",price:2500,img:"https://images.unsplash.com/photo-1539008835657-9e8e9680c956?w=600"},
 {id:2,name:"Ак шым",cat:"Шым",price:1800,img:"https://images.unsplash.com/photo-1594633312681-425c7b97ccd1?w=600"},
 {id:3,name:"Аялдардын блузкасы",cat:"Блузка",price:1500,img:"https://images.unsplash.com/photo-1564257577-5c6d5e9f8c5d?w=600"},
 {id:4,name:"Кара юбка",cat:"Юбка",price:1900,img:"https://images.unsplash.com/photo-1583496661160-fb5886a0aaaa?w=600"},
 {id:5,name:"Күзгү куртка",cat:"Куртка",price:3500,img:"https://images.unsplash.com/photo-1548126032-079a0fb0099d?w=600"},
 {id:6,name:"Кечки көйнөк",cat:"Көйнөк",price:3200,img:"https://images.unsplash.com/photo-1566174053879-31528523f8ae?w=600"},
 {id:7,name:"Кең шым",cat:"Шым",price:2100,img:"https://images.unsplash.com/photo-1506629905607-d9b1b7e6f6b9?w=600"},
 {id:8,name:"Жеңил блузка",cat:"Блузка",price:1700,img:"https://images.unsplash.com/photo-1608234807905-4466023792f5?w=600"}
];

let cart = JSON.parse(localStorage.getItem("cart")||"[]");
let favorites = JSON.parse(localStorage.getItem("favorites")||"[]");
let onlyFavorites = false;

function save(){
 localStorage.setItem("cart",JSON.stringify(cart));
 localStorage.setItem("favorites",JSON.stringify(favorites));
 document.getElementById("count").textContent=
 cart.reduce((s,p)=>s+p.qty,0);
}

function render(){
 const search=document.getElementById("search").value.toLowerCase();
 const cat=document.getElementById("category").value;
 const list=products.filter(p=>
 p.name.toLowerCase().includes(search)&&
 (cat==="all"||p.cat===cat)&&
 (!onlyFavorites||favorites.includes(p.id))
 );
 document.getElementById("products").innerHTML=list.map(p=>`
 <div class="card">
 <img src="${p.img}" alt="${p.name}" loading="lazy">
 <div class="info">
 <h3>${p.name}</h3>
 <p class="price">${p.price.toLocaleString()} сом</p>
 <div class="actions">
 <button onclick="addCart(${p.id})">Себетке</button>
 <button class="heart" onclick="toggleFav(${p.id})">
 ${favorites.includes(p.id)?"❤️":"♡"}
 </button>
 </div>
 </div>
 </div>`).join("");
}

function addCart(id){
 let item=cart.find(p=>p.id===id);
 if(item)item.qty++;
 else cart.push({id,qty:1});
 save();
 alert("Товар себетке кошулду!");
}

function toggleFav(id){
 favorites=favorites.includes(id)?
 favorites.filter(x=>x!==id):[...favorites,id];
 save();render();
}

function showFavorites(){
 onlyFavorites=!onlyFavorites;
 render();
}

function openCart(){
 document.getElementById("cartPanel").style.display="flex";
 updateCart();
}
function closeCart(){
 document.getElementById("cartPanel").style.display="none";
}
function updateCart(){
 const items=document.getElementById("cartItems");
 items.innerHTML=cart.map(p=>{
 const product=products.find(x=>x.id===p.id);
 if(!product)return "";
 return `<div class="cart-row">
 <span>${product.name} × ${p.qty}</span>
 <span>${(product.price*p.qty).toLocaleString()} сом
 <button onclick="removeItem(${p.id})">✕</button></span>
 </div>`;
 }).join("");
 let total=cart.reduce((s,p)=>{
 let x=products.find(a=>a.id===p.id);
 return s+(x?x.price*p.qty:0);
 },0);
 document.getElementById("total").textContent=
 "Жалпы: "+total.toLocaleString()+" сом";
}
function removeItem(id){
 cart=cart.filter(p=>p.id!==id);
 save();updateCart();
}
function checkout(){
 if(!cart.length){alert("Себет бош!");return;}
 if(WHATSAPP==="996XXXXXXXXX"){
 alert("Коддогу WHATSAPP номерин өзүңдүн номериңе алмаштыр.");
 return;
 }
 let msg="Саламатсызбы! Заказ бергим келет:%0A";
 cart.forEach(p=>{
 let x=products.find(a=>a.id===p.id);
 if(x)msg+=`${encodeURIComponent(x.name)} x ${p.qty} = ${x.price*p.qty} сом%0A`;
 });
 let total=cart.reduce((s,p)=>{
 let x=products.find(a=>a.id===p.id);
 return s+(x?x.price*p.qty:0);
 },0);
 msg+=`Жалпы: ${total} сом`;
 window.open("https://wa.me/"+WHATSAPP+"?text="+msg,"_blank");
}
save();
render();
</script>
</body>
</html>
